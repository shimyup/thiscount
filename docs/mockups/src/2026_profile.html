<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common2026.css">
<style>
.content{padding:6px 18px 0}
/* hero glass */
.hero{display:flex;align-items:center;gap:15px;border-radius:26px;padding:16px;margin-bottom:14px}
.avatar{width:66px;height:66px;border-radius:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#08200a;
  background:linear-gradient(145deg,var(--lime),#7bd62f);box-shadow:0 8px 22px rgba(184,255,92,.35)}
.hero .hm{flex:1;min-width:0}
.namerow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.namerow .nm{font-size:21px;font-weight:800;letter-spacing:-.5px}
.tier{height:23px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,var(--gold),#e0b400);color:#241a00}
.handle{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.streak{color:var(--coupon);font-weight:800}

/* BENTO grid */
.bento-h{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.bento-h .t{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--lime)}
.bento-h .m{font-size:12px;font-weight:700;color:var(--faint)}
.bento{display:grid;grid-template-columns:1.45fr 1fr;grid-template-rows:auto auto;gap:10px;margin-bottom:14px}
.cell{border-radius:22px;padding:16px;position:relative;overflow:hidden}
.cell.big{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,rgba(184,255,92,.18),rgba(255,255,255,.05))}
.cell.big .lab{font-size:12px;font-weight:700;color:#d6ffb0}
.cell.big .n{font-size:60px;font-weight:850;line-height:.9;letter-spacing:-3px;
  background:linear-gradient(180deg,#fff,#c7ff9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cell.big .u{font-size:14px;font-weight:700;color:#cfeeb0}
.cell.big .spark{position:absolute;top:14px;right:14px;font-size:20px;opacity:.9}
.cell .sn{font-size:26px;font-weight:850;letter-spacing:-1px}
.cell .sl{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
.cell .sn.gold{color:var(--gold)}.cell .sn.coupon{color:var(--coupon)}.cell .sn.lime{color:var(--lime)}

/* level glass */
.level{border-radius:22px;padding:16px 17px;margin-bottom:13px}
.level .lr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.level .lv{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800}
.level .lv .bd{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#e0b400);color:#241a00;font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center}
.level .nx{font-size:12px;font-weight:700;color:var(--muted)}.level .nx b{color:#fff}
.lvbar{height:9px;border-radius:5px;background:rgba(255,255,255,.10);overflow:hidden}
.lvfill{width:64%;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),#ffe884)}

/* radius row glass */
.rad{border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.rad .ic{width:40px;height:40px;border-radius:13px;background:rgba(184,255,92,.16);display:flex;align-items:center;justify-content:center;font-size:18px}
.rad .rb{flex:1}.rad .rt{font-size:14px;font-weight:800}.rad .rs{font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.rad .rv{font-size:14px;font-weight:850;color:var(--lime)}
</style></head>
<body><div class="screen">
  <div class="statusbar"><span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3C10.7 2.3 12.7 3.2 14.2 4.6L15.6 3.1C13.7 1.3 11.2 .2 8.5 .2S3.3 1.3 1.4 3.1L2.8 4.6C4.3 3.2 6.3 2.3 8.5 2.3Z" fill="#fff"/><path d="M8.5 6C9.6 6 10.6 6.4 11.3 7.1L8.5 10 5.7 7.1C6.4 6.4 7.4 6 8.5 6Z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity=".5" fill="none"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#fff" fill-opacity=".5"/></svg>
    </span>
  </div>

  <div class="content">
    <div class="hero glass">
      <div class="avatar">T</div>
      <div class="hm">
        <div class="namerow"><span class="nm">testuser123</span><span class="tier">👑 Premium</span></div>
        <div class="handle">@testuser123 · <span class="streak">🔥 7일 연속</span></div>
      </div>
    </div>

    <div class="bento-h"><span class="t">이번 달 활동</span><span class="m">2026년 6월</span></div>
    <div class="bento">
      <div class="cell big glass">
        <span class="spark">🎯</span>
        <div class="lab">이번 달 픽업</div>
        <div><div class="n tnum">12</div><div class="u">장 주웠어요</div></div>
      </div>
      <div class="cell glass"><div class="sn coupon tnum">5</div><div class="sl">사용</div></div>
      <div class="cell glass"><div class="sn lime tnum">3</div><div class="sl">방문 매장</div></div>
    </div>

    <div class="level glass">
      <div class="lr">
        <div class="lv"><span class="bd">5</span> 동네 탐험가</div>
        <div class="nx">Lv.6 까지 <b class="tnum">8장</b></div>
      </div>
      <div class="lvbar"><div class="lvfill"></div></div>
    </div>

    <div class="rad glass">
      <div class="ic">📍</div>
      <div class="rb"><div class="rt">내 줍기 반경</div><div class="rs">Premium · 쿨다운 없음</div></div>
      <div class="rv tnum">1km</div>
    </div>
  </div>

  <div class="tabbar glass-strong">
    <div class="tab"><span class="pill"></span><div class="ic">🧭</div>탐험</div>
    <div class="tab"><span class="pill"></span><div class="ic">🗂️</div>수집첩<span class="badge">9</span></div>
    <div class="tab on"><span class="pill"></span><div class="ic">👤</div>프로필</div>
  </div>
  <div class="home-ind"></div>
</div></body></html>

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.screen{background:radial-gradient(130% 70% at 50% 8%,#15201e 0%,var(--bg) 52%)}
.content{display:flex;flex-direction:column;height:100%;padding:0 28px}
.skip{position:absolute;top:62px;right:24px;font-size:14px;font-weight:700;color:var(--faint);z-index:5}

/* illustration */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.scene{position:relative;width:300px;height:300px}
.ring{position:absolute;left:50%;top:56%;border-radius:50%;transform:translate(-50%,-50%)}
.ring.r1{width:300px;height:300px;border:1.5px dashed rgba(47,217,196,.22)}
.ring.r2{width:210px;height:210px;border:1.5px solid rgba(47,217,196,.32);background:radial-gradient(circle,rgba(47,217,196,.07),transparent 70%)}
.ring.r3{width:120px;height:120px;border:2px solid rgba(47,217,196,.5);background:radial-gradient(circle,rgba(47,217,196,.14),transparent)}
/* center phone/me */
.me{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:20px;
  background:linear-gradient(145deg,#2b7a70,#19453f);display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 10px 26px rgba(47,217,196,.35);z-index:4}
/* floating coupon pins */
.cp{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:3}
.cp .h{width:50px;height:50px;border-radius:50% 50% 50% 6px;transform:rotate(45deg);background:var(--surface2);
  border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.cp .h .e{transform:rotate(-45deg);font-size:23px}
.cp.gold .h{border-color:var(--gold);box-shadow:0 0 0 4px rgba(243,196,76,.2),0 8px 18px rgba(0,0,0,.5)}
.cp .lab{margin-top:7px;background:rgba(10,12,14,.85);border:1px solid var(--line);height:21px;padding:0 8px;border-radius:11px;font-size:10.5px;font-weight:800;white-space:nowrap}
.cp.gold .lab{color:var(--gold)}
.cp .e2{position:absolute;top:-8px;right:-4px;font-size:13px}
.dl{position:absolute;width:2px;background:linear-gradient(180deg,rgba(47,217,196,.5),transparent);z-index:1}

/* copy */
.copy{padding-bottom:4px}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
.copy h1{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1.18}
.copy h1 .hl{color:var(--teal)}
.copy p{font-size:15.5px;font-weight:600;color:var(--muted);line-height:1.5;margin-top:14px;max-width:300px}

/* dots + cta */
.dots{display:flex;gap:7px;justify-content:center;margin:24px 0 16px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--surface3);display:block}
.dots i.on{width:22px;background:var(--teal)}
.cta{height:58px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#0a0a0c;margin-bottom:14px}
</style></head>
<body><div class="screen">
  <div class="statusbar"><span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#F4F4F7"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.3C10.7 2.3 12.7 3.2 14.2 4.6L15.6 3.1C13.7 1.3 11.2 .2 8.5 .2S3.3 1.3 1.4 3.1L2.8 4.6C4.3 3.2 6.3 2.3 8.5 2.3Z" fill="#F4F4F7"/><path d="M8.5 6C9.6 6 10.6 6.4 11.3 7.1L8.5 10 5.7 7.1C6.4 6.4 7.4 6 8.5 6Z" fill="#F4F4F7"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#F4F4F7" stroke-opacity=".5" fill="none"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#F4F4F7"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#F4F4F7" fill-opacity=".5"/></svg>
    </span>
  </div>
  <div class="skip">건너뛰기</div>

  <div class="content">
    <div class="stage">
      <div class="scene">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="dl" style="left:60px;top:18px;height:60px;transform:rotate(18deg)"></div>
        <div class="dl" style="right:54px;top:40px;height:50px;transform:rotate(-20deg)"></div>
        <div class="cp gold" style="left:24px;top:30px"><div class="h"><span class="e">☕</span></div><span class="e2">✦</span><div class="lab">1+1</div></div>
        <div class="cp" style="right:6px;top:48px"><div class="h"><span class="e">🍔</span></div><div class="lab">30%</div></div>
        <div class="cp" style="left:6px;bottom:18px"><div class="h"><span class="e">💄</span></div><div class="lab">첫방문</div></div>
        <div class="cp" style="right:18px;bottom:8px"><div class="h"><span class="e">🎉</span></div><div class="lab">행사</div></div>
        <div class="me">🧭</div>
      </div>
    </div>

    <div class="copy">
      <div class="kicker">위치 기반 쿠폰</div>
      <h1>내 주변 혜택을<br><span class="hl">주워</span> 담으세요</h1>
      <p>걷다 보면 근처 매장의 쿠폰이 지도에 뚝뚝. 가까이 가서 톡 줍기만 하면 끝.</p>
    </div>

    <div class="dots"><i class="on"></i><i></i><i></i></div>
    <div class="cta">시작하기</div>
  </div>
  <div class="home-ind"></div>
</div></body></html>

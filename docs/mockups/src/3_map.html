<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.screen{background:#0c1014}
/* fake dark map */
.map{position:absolute;inset:0;background:
  linear-gradient(180deg,#0e1318 0%,#0b0f13 100%);overflow:hidden}
.block{position:absolute;background:#141b21;border-radius:7px}
.park{position:absolute;background:radial-gradient(circle at 40% 40%,#16302a,#11231f);border-radius:14px}
.water{position:absolute;background:linear-gradient(135deg,#10283a,#0d1f2e);border-radius:10px}
.road{position:absolute;background:#1b242c}
.roadc{position:absolute;background:#222e38}
/* radius circle (Free teal 200m) */
.radius{position:absolute;left:50%;top:48%;width:300px;height:300px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(47,217,196,.12) 0%,rgba(47,217,196,.05) 60%,transparent 72%);
  border:2px solid rgba(47,217,196,.5);box-shadow:0 0 50px rgba(47,217,196,.18) inset}
.radius .ring2{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(47,217,196,.28);animation:none}
.radlabel{position:absolute;left:50%;top:calc(48% + 152px);transform:translate(-50%,-50%);
  background:rgba(47,217,196,.16);border:1px solid rgba(47,217,196,.4);color:#9bf0e4;font-size:11px;font-weight:800;
  height:22px;padding:0 10px;border-radius:11px;display:flex;align-items:center;gap:4px;letter-spacing:.3px}
/* user marker */
.me{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:6}
.me .pulse{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(47,217,196,.22)}
.me .dot{width:26px;height:26px;border-radius:50%;background:#2FD9C4;border:3px solid #06120f;box-shadow:0 4px 12px rgba(47,217,196,.5);position:relative}
/* pins */
.pin{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
.pin .head{width:48px;height:48px;border-radius:50% 50% 50% 6px;transform:rotate(45deg);
  background:var(--surface2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pin .head .e{transform:rotate(-45deg);font-size:22px}
.pin.rare .head{border-color:var(--gold);box-shadow:0 0 0 4px rgba(243,196,76,.22),0 6px 18px rgba(0,0,0,.5)}
.pin.epic .head{border-color:#b97bff;background:linear-gradient(145deg,#2a1f3a,#1c1528);box-shadow:0 0 0 5px rgba(185,123,255,.25),0 6px 18px rgba(0,0,0,.5)}
.pin .sparkle{position:absolute;top:-9px;right:-5px;font-size:14px}
.pin .tag{margin-top:6px;background:rgba(10,12,14,.9);border:1px solid var(--line);height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pin.rare .tag{color:var(--gold)}
.pin.epic .tag{color:#cba6ff}

/* top proximity chip */
.topbar{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:center;z-index:10}
.prox{background:rgba(18,20,24,.86);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:20px;
  height:52px;padding:0 8px 0 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg)}
.prox .arrow{width:30px;height:30px;border-radius:50%;background:var(--coupon);display:flex;align-items:center;justify-content:center;transform:rotate(38deg)}
.prox .pmain{display:flex;flex-direction:column}
.prox .pt{font-size:14px;font-weight:800;letter-spacing:-.2px}
.prox .ps{font-size:11.5px;font-weight:700;color:var(--coupon)}
.prox .pcount{background:var(--surface2);height:34px;padding:0 13px;border-radius:17px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--teal)}

/* brand header pill top-left */
.brandpill{position:absolute;top:60px;left:16px;z-index:9;display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;letter-spacing:-.3px;opacity:.85}
.brandpill .lg{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#FF7A45,#ff9a6d);display:flex;align-items:center;justify-content:center;font-size:14px}
</style></head>

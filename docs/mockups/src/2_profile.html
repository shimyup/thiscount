<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.content{padding:8px 20px 0}
/* hero */
.hero{display:flex;align-items:center;gap:16px;padding:8px 2px 22px}
.avatar{width:78px;height:78px;border-radius:26px;background:linear-gradient(145deg,#2b7a70,#1b4a44);
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#eafdfa;
  box-shadow:0 8px 22px rgba(47,217,196,.22);position:relative;flex-shrink:0}
.avatar .edit{position:absolute;bottom:-3px;right:-3px;width:26px;height:26px;border-radius:13px;background:var(--surface3);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.hero .h-main{flex:1;min-width:0}
.namerow{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.namerow .nm{font-size:23px;font-weight:800;letter-spacing:-.5px}
.tier{height:25px;padding:0 11px;border-radius:13px;background:linear-gradient(135deg,#f3c44c,#d9a52f);color:#241a04;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.handle{font-size:13.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.streakpill{display:inline-flex;align-items:center;gap:4px;color:var(--coupon);font-weight:800}

/* this month activity — single hero card */
.act{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.act .top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.act .lbl{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal)}
.act .month{font-size:12px;font-weight:700;color:var(--faint)}
.act .heronum{display:flex;align-items:baseline;gap:9px;margin:6px 0 18px}
.act .heronum .n{font-size:54px;font-weight:800;letter-spacing:-2px;line-height:.9;
  background:linear-gradient(180deg,#fff,#bfeee7);-webkit-background-clip:text;background-clip:text;color:transparent}
.act .heronum .u{font-size:15px;font-weight:700;color:var(--muted);padding-bottom:6px}
.act .grid{display:flex;gap:10px}
.act .g{flex:1;background:var(--surface2);border-radius:15px;padding:13px 12px}
.act .g .gn{font-size:21px;font-weight:800;letter-spacing:-.5px}
.act .g .gl{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.act .g .gn.gold{color:var(--gold)}
.act .g .gn.teal{color:var(--teal)}
.act .g .gn.coupon{color:var(--coupon)}

/* level progress */
.level{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.level .lr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.level .lv{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.level .lv .badge{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#f3c44c,#d9a52f);color:#241a04;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.level .nextlv{font-size:12px;font-weight:700;color:var(--muted)}
.level .nextlv b{color:var(--txt)}
.lvbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.lvfill{width:64%;height:100%;border-radius:5px;background:linear-gradient(90deg,#f3c44c,#ffe08a)}
.level .ltip{font-size:11.5px;font-weight:600;color:var(--faint);margin-top:9px}

/* radius row */
.rad{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px 18px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}
.rad .ric{width:42px;height:42px;border-radius:13px;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-size:19px}
.rad .rb{flex:1}
.rad .rt{font-size:14px;font-weight:800}
.rad .rs{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.rad .rv{font-size:13px;font-weight:800;color:var(--teal)}
</style></head>

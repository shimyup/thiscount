<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.head{padding:6px 20px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between}
.titlerow h1{font-size:28px;font-weight:800;letter-spacing:-.8px;display:flex;align-items:baseline;gap:8px}
.titlerow h1 .cnt{font-size:15px;font-weight:700;color:var(--teal)}
.head-actions{display:flex;align-items:center;gap:10px}
.sort{height:34px;padding:0 12px;border-radius:17px;background:var(--surface2);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--txt)}
.icon-btn{width:36px;height:36px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#1a1505;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
/* progress absorbed into header */
.prog{display:flex;align-items:center;gap:10px;margin-top:14px}
.prog .pbar{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog .pfill{width:18%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),#5fe8d6)}
.prog .ptxt{font-size:12px;font-weight:700;color:var(--muted)}
.prog .ptxt b{color:var(--txt)}

/* single expiry siren */
.siren{margin:16px 20px 4px;height:52px;border-radius:16px;display:flex;align-items:center;gap:11px;padding:0 14px;
  background:linear-gradient(90deg,rgba(255,122,69,.16),rgba(255,122,69,.06));border:1px solid rgba(255,122,69,.32)}
.siren .dot{width:34px;height:34px;border-radius:11px;background:rgba(255,122,69,.18);display:flex;align-items:center;justify-content:center;font-size:17px}
.siren .st{flex:1;font-size:13.5px;font-weight:700;line-height:1.3}
.siren .st b{color:var(--coupon)}
.siren .go{font-size:13px;font-weight:800;color:var(--coupon);display:flex;align-items:center;gap:3px}

/* filter chips */
.filters{display:flex;gap:8px;padding:14px 20px 6px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent)}
.fchip{height:32px;padding:0 14px;border-radius:16px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;white-space:nowrap;flex-shrink:0}
.fchip.on{background:var(--teal);color:#04201c}

/* list */
.list{padding:6px 20px 0;display:flex;flex-direction:column;gap:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;display:flex;gap:14px;box-shadow:var(--shadow);position:relative}
.card .body{flex:1;min-width:0}
.card .store{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:3px}
.card .benefit{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.15;color:var(--txt)}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:11px}
.exp{height:26px;padding:0 10px;border-radius:8px;background:rgba(255,122,69,.16);color:var(--coupon);font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.exp.soft{background:var(--surface2);color:var(--muted)}
.codechip{height:26px;padding:0 10px;border-radius:8px;background:var(--surface2);color:var(--txt);font-size:12px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.codechip .k{color:var(--teal)}
/* rare glow card */
.card.rare{border-color:rgba(243,196,76,.4);background:linear-gradient(180deg,rgba(243,196,76,.07),var(--surface))}
.card.rare::before{content:"";position:absolute;inset:-1px;border-radius:var(--radius);padding:1px;background:linear-gradient(135deg,rgba(243,196,76,.6),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.rarebadge{position:absolute;top:13px;right:13px;font-size:11px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:3px}
.thumb-food{background:linear-gradient(145deg,#3a2418,#241510)}
.thumb-cafe{background:linear-gradient(145deg,#2e2416,#1c160d)}
.thumb-beauty{background:linear-gradient(145deg,#33172a,#1f0f1a)}
.thumb-fashion{background:linear-gradient(145deg,#1c2433,#11161f)}
.used{opacity:.5}
.used .benefit{text-decoration:line-through;text-decoration-color:var(--faint)}
</style></head>
<body><div class="screen">

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common2026.css">
<style>
.head{padding:6px 18px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between}
.titlerow h1{font-size:27px;font-weight:850;letter-spacing:-.8px;display:flex;align-items:baseline;gap:8px}
.titlerow h1 .c{font-size:15px;font-weight:800;color:var(--lime)}
.ha{display:flex;gap:9px}
.ib{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px}
.siren{margin:14px 18px 2px;height:52px;border-radius:18px;display:flex;align-items:center;gap:11px;padding:0 14px;
  background:rgba(255,77,109,.13);backdrop-filter:blur(20px);border:1px solid rgba(255,77,109,.32)}
.siren .d{width:34px;height:34px;border-radius:12px;background:rgba(255,77,109,.2);display:flex;align-items:center;justify-content:center;font-size:17px}
.siren .t{flex:1;font-size:13.5px;font-weight:700}.siren .t b{color:var(--coupon)}
.siren .g{font-size:13px;font-weight:800;color:var(--coupon)}
.filters{display:flex;gap:8px;padding:13px 18px 6px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent)}
.fc{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.fc.on{background:var(--lime);color:#04200a;border-color:transparent}
.list{padding:6px 18px 0;display:flex;flex-direction:column;gap:12px}
.card{border-radius:22px;padding:15px;display:flex;gap:14px;position:relative}
.thumb{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:29px;flex-shrink:0}
.t-cafe{background:linear-gradient(145deg,#2e2416,#1c160d)}
.t-food{background:linear-gradient(145deg,#3a2418,#241510)}
.t-beauty{background:linear-gradient(145deg,#33172a,#1f0f1a)}
.body{flex:1;min-width:0}
.store{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.benefit{font-size:20px;font-weight:850;letter-spacing:-.5px;line-height:1.12}
.meta{display:flex;align-items:center;gap:8px;margin-top:11px}
.exp{height:26px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;background:rgba(255,77,109,.16);color:var(--coupon)}
.exp.soft{background:rgba(255,255,255,.07);color:var(--muted)}
.code{height:26px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07)}
.code .k{color:var(--lime)}
.card.rare{border-color:rgba(255,214,10,.4)}
.rb{position:absolute;top:13px;right:14px;font-size:11px;font-weight:800;color:var(--gold)}
</style></head>
<body><div class="screen">
  <div class="statusbar"><span class="time">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3C10.7 2.3 12.7 3.2 14.2 4.6L15.6 3.1C13.7 1.3 11.2 .2 8.5 .2S3.3 1.3 1.4 3.1L2.8 4.6C4.3 3.2 6.3 2.3 8.5 2.3Z" fill="#fff"/><path d="M8.5 6C9.6 6 10.6 6.4 11.3 7.1L8.5 10 5.7 7.1C6.4 6.4 7.4 6 8.5 6Z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" stroke-opacity=".5" fill="none"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#fff" fill-opacity=".5"/></svg>
    </span>
  </div>

  <div class="head">
    <div class="titlerow">
      <h1>수집첩 <span class="c tnum">9장</span></h1>
      <div class="ha">
        <div class="ib glass">🔍</div>
        <div class="ib glass">🎟️</div>
      </div>
    </div>
  </div>

  <div class="siren">
    <div class="d">🔥</div>
    <div class="t"><b>1장</b>이 24시간 안에 만료돼요</div>

  </div>

  <div class="filters">
    <div class="fc on">전체</div><div class="fc">음식</div><div class="fc">카페</div><div class="fc">뷰티</div><div class="fc">패션</div><div class="fc">행사</div>
  </div>

  <div class="list">
    <div class="card glass">
      <div class="thumb t-cafe">☕</div>
      <div class="body">
        <div class="store">스타로스트 커피 · 카페</div>
        <div class="benefit">아메리카노 1+1</div>
        <div class="meta"><span class="exp">⏳ D-2 만료</span><span class="code"><span class="k">코드</span> 7K2Q9</span></div>
      </div>
    </div>
    <div class="card glass rare">
      <span class="rb">✦ RARE</span>
      <div class="thumb t-food">🍔</div>
      <div class="body">
        <div class="store">버거랩 신촌점 · 음식</div>
        <div class="benefit">더블패티 30% 할인</div>
        <div class="meta"><span class="exp soft">D-6 만료</span><span class="code"><span class="k">코드</span> M4B1X</span></div>
      </div>
    </div>
    <div class="card glass">
      <div class="thumb t-beauty">💄</div>
      <div class="body">
        <div class="store">글로우 네일 · 뷰티</div>
        <div class="benefit">젤네일 첫 방문 50%</div>
        <div class="meta"><span class="exp soft">D-11 만료</span><span class="code"><span class="k">코드</span> GLOW5</span></div>
      </div>
    </div>
  </div>

  <div class="tabbar glass-strong">
    <div class="tab"><span class="pill"></span><div class="ic">🧭</div>탐험</div>
    <div class="tab on lime"><span class="pill"></span><div class="ic">🗂️</div>수집첩<span class="badge">9</span></div>
    <div class="tab"><span class="pill"></span><div class="ic">👤</div>프로필</div>
  </div>
  <div class="home-ind"></div>
</div></body></html>
